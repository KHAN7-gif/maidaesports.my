<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAIDA Esports — Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#171329;--soft:#756f84;--line:rgba(73,44,150,.11);--pink:#e5007d;--pink2:#ff1493;--purple:#7042e9;--bg:#f6f3ff;--shadow:0 18px 55px rgba(76,46,170,.12)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 8%,rgba(172,117,255,.25),transparent 30%),radial-gradient(circle at 90% 12%,rgba(89,203,255,.2),transparent 28%),linear-gradient(180deg,#faf8ff,#f0edff 55%,#f9f8ff);min-height:100vh;-webkit-font-smoothing:antialiased}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
.nav{position:sticky;top:14px;z-index:20;width:min(1180px,calc(100% - 28px));margin:14px auto 0;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);border-radius:20px;backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(73,43,157,.11)}.navin{height:66px;display:flex;align-items:center;gap:26px;padding:0 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-right:auto}.mark{width:40px;height:40px;border-radius:13px;background:#111;color:#fff;display:grid;place-items:center;font-size:11px;overflow:hidden}.mark img{width:100%;height:100%;object-fit:contain}.menu{display:flex;gap:3px;align-items:center}.menu a{font-size:12px;color:#716a82;padding:9px 11px;border-radius:11px}.menu a:hover{background:rgba(112,66,233,.08);color:#382765}.cta{padding:12px 18px;border-radius:14px;color:#fff!important;font-weight:800;background:linear-gradient(135deg,#b90063,#e5007d 58%,#ff1493);box-shadow:0 10px 25px rgba(229,0,125,.23)}
main{padding:74px 0 90px}.hero{text-align:center;max-width:850px;margin:auto}.eyebrow{color:var(--pink);font-weight:800;font-size:12px;letter-spacing:.13em}.hero h1{font-size:clamp(42px,6vw,70px);line-height:.98;letter-spacing:-.055em;margin:15px 0;background:linear-gradient(100deg,#5e35dc,#a44cff,#e5007d);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{font-size:16px;line-height:1.65;color:var(--soft);max-width:620px;margin:18px auto}.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:34px auto 30px}.tab{border:1px solid var(--line);background:rgba(255,255,255,.68);color:#6e6780;border-radius:999px;padding:10px 17px;font-size:12px;font-weight:800;cursor:pointer}.tab.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 8px 22px rgba(229,0,125,.18)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.88);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);transition:.3s}.card:hover{transform:translateY(-7px);box-shadow:0 28px 70px rgba(76,46,170,.18)}.media{aspect-ratio:1/1;background:linear-gradient(145deg,#eee7ff,#e9f8ff);position:relative;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover}.cat,.stock{position:absolute;top:12px;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:800;background:rgba(255,255,255,.84);backdrop-filter:blur(8px)}.cat{left:12px;color:#6c6380}.stock{right:12px;color:#23824a}.body{padding:20px}.body h2{font-size:18px;line-height:1.2;margin:0}.desc{color:var(--soft);font-size:13px;line-height:1.55;margin:8px 0 0;min-height:40px}.sizes{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.size{font-size:10px;border:1px solid #e5e0ef;padding:4px 7px;border-radius:7px;color:#756d84}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px}.price{font-size:20px;font-weight:800}.order{border:0;background:linear-gradient(135deg,#b90063,#e5007d,#ff1493);color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#8a8398;border:1.5px dashed var(--line);border-radius:24px;background:rgba(255,255,255,.45)}footer{padding:26px 0;border-top:1px solid rgba(73,44,150,.08);text-align:center;color:#8a8398;font-size:12px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.menu{display:none}.navin{height:60px}.hero h1{font-size:clamp(42px,8vw,62px)}}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.nav{width:calc(100% - 16px);top:8px}.navin{padding:0 8px}.brand{font-size:14px}.mark{width:37px;height:37px;border-radius:12px}.cta{padding:10px 14px;font-size:11px}.hero{text-align:center}.hero h1{font-size:40px}.hero p{font-size:14px}.grid{grid-template-columns:1fr;gap:14px}.media{aspect-ratio:4/3}.body{padding:18px}}
</style></head>
<body>
<header class="nav"><div class="navin"><a class="brand" href="index.html"><span class="mark" id="logo">MDE</span><span>MAIDA ESPORTS</span></a><nav class="menu"><a href="index.html">Home</a><a href="achievement.html">Achievement</a><a href="game.html">Game</a><a href="index.html#events">Acara</a><a href="index.html#contact">Hubungi</a></nav><a class="cta" href="#shop">Shop</a></div></header>
<main><div class="wrap"><section class="hero"><span class="eyebrow">MAIDA OFFICIAL SHOP</span><h1>Jersi & merchandise rasmi.</h1><p>Dapatkan barangan rasmi MAIDA Esports untuk pemain, komuniti dan penyokong kami.</p></section><div class="tabs" id="tabs"><button class="tab active" data-filter="all">Semua</button><button class="tab" data-filter="Jersey">Jersey</button><button class="tab" data-filter="Merchandise">Merchandise</button></div><section class="grid" id="grid"><div class="empty">Memuatkan produk…</div></section></div></main><footer>© MAIDA Esports · Shop rasmi</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
const cfg={apiKey:"AIzaSyCcTJO9K0gXRaCbzdxqxY7hKr0x1PhNHEQ",authDomain:"maidaesportsmy.firebaseapp.com",databaseURL:"https://maidaesportsmy-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"maidaesportsmy",storageBucket:"maidaesportsmy.firebasestorage.app",messagingSenderId:"870248060201",appId:"1:870248060201:web:2954d8fed62c18d47dd338"};
const db=getDatabase(initializeApp(cfg)),node=ref(db,"site/content");const esc=s=>(s==null?"":String(s)).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const drive=u=>{if(!u)return'';u=String(u).trim();const m=u.match(/\/file\/d\/([-\w]{20,})/)||u.match(/[?&]id=([-\w]{20,})/)||u.match(/\/d\/([-\w]{20,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u};const wa=p=>{const d=String(p||'').replace(/\D/g,'');return d?'https://wa.me/'+(d.startsWith('0')?'6'+d.slice(1):d):'#'};
let products=[],phone='';function render(filter='all'){const list=filter==='all'?products:products.filter(x=>String(x.category||'').toLowerCase()===filter.toLowerCase());const grid=document.getElementById('grid');grid.innerHTML=list.length?list.map(x=>{const src=drive(x.image||'');const media=src?`<img src="${esc(src)}" alt="${esc(x.name||'Produk MAIDA')}" loading="lazy">`:`<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:62px">${String(x.category||'').toLowerCase().includes('jersey')?'👕':'🛍️'}</div>`;const sizes=String(x.sizes||'').split(',').map(s=>s.trim()).filter(Boolean);const href=x.link||wa(phone);return `<article class="card"><div class="media">${media}<span class="cat">${esc(x.category||'Merchandise')}</span><span class="stock">${esc(x.stock||'Available')}</span></div><div class="body"><h2>${esc(x.name||'Produk MAIDA')}</h2><p class="desc">${esc(x.desc||'')}</p>${sizes.length?`<div class="sizes">${sizes.map(s=>`<span class="size">${esc(s)}</span>`).join('')}</div>`:''}<div class="row"><span class="price">${esc(x.price||'RM0')}</span><a class="order" href="${esc(href)}" target="_blank" rel="noopener">Tempah</a></div></div></article>`}).join(''):'<div class="empty">Tiada produk dalam kategori ini.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});
try{const snap=await get(node);if(snap.exists()){const d=snap.val()||{};products=Array.isArray(d.shop?.items)?d.shop.items:[];phone=d.settings?.phone||'';const logo=drive(d.brand?.logo||'');if(logo)document.getElementById('logo').innerHTML=`<img src="${esc(logo)}" alt="MAIDA">`;if(d.shop?.enabled===false){document.getElementById('grid').innerHTML='<div class="empty">Shop sedang ditutup.</div>';document.getElementById('tabs').style.display='none'}else render('all')}else render('all')}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Shop tidak dapat dimuat sekarang. Sila cuba semula.</div>'}
</script></body></html>
