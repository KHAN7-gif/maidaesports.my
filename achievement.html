<style>
:root{--ink:#1d1530;--soft:#716a80;--mut:#9a93aa;--pink:#e5007d;--pink2:#ff1493;--violet:#7a42f4;--bg:#f5f1ff;--panel:rgba(255,255,255,.68);--line:rgba(89,55,160,.10);--shadow:0 22px 60px rgba(74,42,160,.13);--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--font);background:radial-gradient(circle at 8% 8%,rgba(166,105,255,.25),transparent 28%),radial-gradient(circle at 92% 20%,rgba(77,198,255,.20),transparent 25%),linear-gradient(180deg,#faf8ff,#f0edff 55%,#fbfaff);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
.nav{position:sticky;top:14px;z-index:20;margin:14px auto 0;width:min(1180px,calc(100% - 28px));height:66px;border:1px solid rgba(255,255,255,.8);border-radius:20px;background:rgba(255,255,255,.68);backdrop-filter:blur(22px);box-shadow:0 12px 38px rgba(75,44,155,.11)}.nav-in{height:100%;display:flex;align-items:center;gap:24px;padding:0 14px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}.mark{width:40px;height:40px;border-radius:13px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.menu{margin-left:auto;display:flex;gap:4px}.menu a{padding:9px 11px;border-radius:11px;color:#716a82;font-size:13px}.menu a:hover{background:rgba(120,70,240,.08);color:#3b286e}.cta{padding:11px 17px;border-radius:14px;background:linear-gradient(135deg,#b90063,#e5007d,#ff1493);color:#fff;font-size:13px;font-weight:800;box-shadow:0 10px 25px rgba(229,0,125,.24)}
.hero{padding:96px 0 50px;text-align:center}.eyebrow{color:var(--pink);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(44px,6vw,76px);line-height:.96;letter-spacing:-.06em;margin:16px auto 18px;max-width:850px}.grad{background:linear-gradient(100deg,#6538df,#a34bff,#e5007d);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:650px;margin:auto;color:var(--soft);line-height:1.65;font-size:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 24px}.count{font-size:13px;color:var(--soft)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:rgba(255,255,255,.65);color:#6f6880;padding:9px 13px;border-radius:999px;font:700 12px var(--font);cursor:pointer}.filter.active{background:var(--pink);border-color:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:90px}.card{overflow:hidden;border:1px solid rgba(255,255,255,.82);border-radius:28px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow);transition:.3s}.card:hover{transform:translateY(-7px);box-shadow:0 30px 75px rgba(74,42,160,.18)}.media{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,#ded3ff,#d8f3ff)}.media img{width:100%;height:100%;object-fit:cover;display:block}.place{position:absolute;left:14px;top:14px;background:linear-gradient(135deg,#b90063,#e5007d,#ff1493);color:#fff;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:800;box-shadow:0 8px 20px rgba(229,0,125,.23)}.fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:60px}.body{padding:22px}.game{font-size:11px;color:var(--violet);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.body h3{font-size:22px;margin:8px 0;color:#211a34}.body p{color:var(--soft);font-size:13px;line-height:1.6;min-height:42px}.meta{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:15px;font-size:11px;color:var(--mut)}.meta b{color:#4b3c6e}.empty{text-align:center;padding:70px 20px;color:var(--mut)}
footer{padding:30px 0;color:#fff;background:#181128;text-align:center;font-size:12px}
@media(max-width:900px){.menu a:nth-child(n+5){display:none}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{width:min(100% - 24px,520px)}.nav{top:8px}.nav-in{gap:9px}.brand{font-size:14px}.brand .mark{width:36px;height:36px}.menu{display:none}.cta{margin-left:auto}.hero{padding:72px 0 34px}.hero h1{font-size:44px}.hero p{font-size:14px}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr;gap:15px}.card{border-radius:23px}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in"><a class="brand" href="index.html"><span class="mark">MDE</span><span>MAIDA ESPORTS</span></a><nav class="menu"><a href="index.html">Home</a><a href="index.html#about">Siapa Kami</a><a href="index.html#services">Perkhidmatan</a><a href="index.html#events">Acara</a><a href="game.html">Game</a><a href="achievement.html">Achievement</a><a href="shop.html">Shop</a></nav><a class="cta" href="index.html#contact">Sertai Kami</a></div></header>
<main>
<section class="hero"><div class="wrap"><div class="eyebrow">MAIDA Esports · Achievement</div><h1>Rekod <span class="grad">pencapaian</span> kami.</h1><p>Jelajahi pencapaian atlet, pasukan dan komuniti MAIDA Esports dalam pelbagai kejohanan dan game.</p></div></section>
<section class="wrap"><div class="toolbar"><div class="count" id="count">Memuatkan pencapaian…</div><div class="filters" id="filters"></div></div><div class="grid" id="grid"></div></section>
</main><footer>© <span id="year"></span> MAIDA Esports · Labuan</footer>
<script>
const KEY='maida_content';let data=null,active='Semua';
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function driveUrl(u){if(!u)return '';u=String(u).trim();const m=u.match(/\/file\/d\/([-\w]{20,})/)||u.match(/[?&]id=([-\w]{20,})/)||u.match(/\/d\/([-\w]{20,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u}
function render(){const obj=data&&data.achievement?data.achievement:{enabled:true,items:[]};const items=obj.items||[];if(obj.enabled===false){document.getElementById('count').textContent='Achievement sedang tidak dipaparkan.';document.getElementById('grid').innerHTML='<div class="empty">Kandungan Achievement kini dinyahaktifkan oleh admin.</div>';return}const games=['Semua',...new Set(items.map(x=>x.game).filter(Boolean))];document.getElementById('filters').innerHTML=games.map(g=>`<button class="filter ${g===active?'active':''}" onclick="active='${esc(g).replace(/'/g,'&#39;')}';render()">${esc(g)}</button>`).join('');const shown=active==='Semua'?items:items.filter(x=>x.game===active);document.getElementById('count').textContent=`${shown.length} pencapaian`;document.getElementById('grid').innerHTML=shown.length?shown.map(x=>{const src=driveUrl(x.image);return `<article class="card"><div class="media">${src?`<img src="${esc(src)}" loading="lazy" alt="${esc(x.athlete||'Achievement')}">`:`<div class="fallback">${esc((x.place||'🏆').split(' ')[0])}</div>`}<span class="place">${esc(x.place||'Achievement')}</span></div><div class="body"><div class="game">${esc(x.game||'Esports')}</div><h3>${esc(x.athlete||'MAIDA Esports')}</h3><p>${esc(x.desc||x.event||'')}</p><div class="meta"><span>${esc(x.event||'')}</span><b>${esc(x.year||'')}</b></div></div></article>`}).join(''):'<div class="empty">Belum ada pencapaian untuk kategori ini.</div>'}
async function load(){try{const raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw)}catch(e){}try{const r=await fetch('maida-content.json',{cache:'no-store'});if(r.ok)data=await r.json()}catch(e){}render()}load();document.getElementById('year').textContent=new Date().getFullYear();
</script>
<script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';const firebaseConfig={apiKey:'AIzaSyCcTJO9K0gXRaCbzdxqxY7hKr0x1PhNHEQ',authDomain:'maidaesportsmy.firebaseapp.com',databaseURL:'https://maidaesportsmy-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'maidaesportsmy',storageBucket:'maidaesportsmy.firebasestorage.app',messagingSenderId:'870248060201',appId:'1:870248060201:web:2954d8fed62c18d47dd338'};try{const db=getDatabase(initializeApp(firebaseConfig));onValue(ref(db,'site/content'),snap=>{if(snap.exists()){window.data=snap.val();try{localStorage.setItem('maida_content',JSON.stringify(window.data))}catch(e){}render()}})}catch(e){console.warn(e)}</script>
</body></html>
