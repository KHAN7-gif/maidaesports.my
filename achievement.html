<main><section class="hero"><div class="wrap"><div class="eyebrow">MAIDA ESPORTS · ACHIEVEMENT</div><h1>Rekod <span class="grad">pencapaian</span> kami.</h1><p>Jelajahi pencapaian atlet, pasukan dan komuniti MAIDA Esports dalam pelbagai kejohanan dan game.</p></div></section><section class="wrap"><div class="toolbar"><div class="count" id="count">Memuatkan pencapaian…</div><button class="filter active" id="all">All</button><select class="select" id="game"><option value="">Title Game</option></select><select class="select" id="year"><option value="">Tahun</option></select><select class="select" id="place"><option value="">Pencapaian</option></select><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg><input id="q" type="search" placeholder="Carian — cari player/team/tournament"></label></div><div class="grid" id="grid"></div></section></main><footer>© <span id="yr"></span> MAIDA Esports · Labuan</footer>
<script>
const KEY='maida_content';let data=null;let items=[];const $=id=>document.getElementById(id);const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function drive(u){if(!u)return '';u=String(u).trim();const m=u.match(/\/file\/d\/([-\w]{20,})/)||u.match(/[?&]id=([-\w]{20,})/)||u.match(/\/d\/([-\w]{20,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u}
function dummy(){const games=['MLBB','eFootball Console','PUBG','Valorant','Dota 2','EA FC','Gran Turismo','Tekken 8'];const events=['Labuan Esports Championship','Karnival Sukan HSWP','Sabah Esports Cup','MAIDA League','Borneo Valorant Series','Labuan Dota Cup','Malaysia eFootball Series','East Malaysia Cup','Community GT Cup','Labuan Survival Cup'];const people=['MDE X KZ','MDE Puslifan','MDE Esports','MDE Team','MDE 23ZHNIA','MDE Ladies','MDE Dota','Labuan Squad'];const places=['🥇 Johan','🥈 Naib Johan','🥉 Tempat Ketiga','4️⃣ Top 4','8️⃣ Top 8','🏅 Penyertaan'];return Array.from({length:20},(_,i)=>({id:'demo-'+(i+1),place:places[i%places.length],game:games[i%games.length],athlete:people[i%people.length],year:String(2026-Math.floor(i/5)),event:events[i%events.length],tournament:events[i%events.length],desc:'Rekod pencapaian rasmi MAIDA Esports.',image:''}))}function fill(el,vals,label){el.innerHTML='<option value="">'+label+'</option>'+[...new Set(vals.filter(Boolean))].map(v=>'<option>'+esc(v)+'</option>').join('')}
function render(){const obj=data?.achievement||{};if(obj.enabled===false){$('count').textContent='Achievement sedang tidak dipaparkan.';$('grid').innerHTML='<div class="empty">Kandungan Achievement kini dinyahaktifkan oleh admin.</div>';return}items=Array.isArray(obj.items)?obj.items:Object.values(obj.items||{});if(!items.length)items=dummy();fill($('game'),items.map(x=>x.game),'Title Game');fill($('year'),items.map(x=>x.year),'Tahun');fill($('place'),items.map(x=>x.place||x.achievement),'Pencapaian');apply(false)}
function apply(){const g=$('game').value,y=$('year').value,p=$('place').value,q=$('q').value.toLowerCase().trim();let a=items;if(g)a=a.filter(x=>String(x.game||'')===g);if(y)a=a.filter(x=>String(x.year||'')===y);if(p)a=a.filter(x=>String(x.place||x.achievement||'')===p);if(q)a=a.filter(x=>[x.athlete,x.team,x.player,x.event,x.tournament,x.game].map(v=>String(v||'').toLowerCase()).join(' ').includes(q));$('all').classList.toggle('active',!g&&!y&&!p&&!q);$('count').textContent=a.length+' pencapaian'+(items[0]?.id?.startsWith('demo-')?' · Demo':'');$('grid').innerHTML=a.length?a.map(x=>{const src=drive(x.image);return '<article class="card"><div class="media">'+(src?'<img src="'+esc(src)+'" loading="lazy" alt="'+esc(x.athlete||'Achievement')+'">':'<div class="fallback">'+esc((x.place||'🏆').split(' ')[0])+'</div>')+'<span class="place">'+esc(x.place||'🏅')+'</span><span class="year">'+esc(x.year||'')+'</span></div><div class="body"><div class="game">'+esc(x.game||'Esports')+'</div><div class="title">'+esc(x.event||x.tournament||'Achievement')+'</div><div class="tournament">'+esc(x.tournament||x.event||'')+'</div><div class="player">'+esc(x.athlete||x.team||x.player||'MAIDA Esports')+'</div><div class="meta"><span>'+esc(x.event||'')+'</span><b>'+esc(x.year||'')+'</b></div></div></article>'}).join(''):'<div class="empty">Tiada pencapaian yang sepadan.</div>'}
$('all').onclick=()=>{$('game').value='';$('year').value='';$('place').value='';$('q').value='';apply()};['game','year','place'].forEach(id=>$(id).addEventListener('change',apply));$('q').addEventListener('input',apply);$('yr').textContent=new Date().getFullYear();async function load(){try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}try{const r=await fetch('maida-content.json',{cache:'no-store'});if(r.ok)data=await r.json()}catch(e){}render()}load();
</script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';const c={apiKey:'AIzaSyCcTJO9K0gXRaCbzdxqxY7hKr0x1pHNEQ',authDomain:'maidaesportsmy.firebaseapp.com',databaseURL:'https://maidaesportsmy-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'maidaesportsmy',storageBucket:'maidaesportsmy.firebasestorage.app',messagingSenderId:'870248060201',appId:'1:870248060201:web:2954d8fed62c18d47dd338'};try{onValue(ref(getDatabase(initializeApp(c)),'site/content'),s=>{if(s.exists()){data=s.val();try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}render()}})}catch(e){}</script></body></html>
