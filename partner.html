<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rakan Kerjasama — MAIDA Esports</title><style>
:root{--pink:#e5007d;--ink:#0b0b12;--mut:#737783;--line:#e9e9ef;--bg:#f7f7fa}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}header{padding:28px 0 10px}.back{font-weight:700;color:var(--pink)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);margin-top:38px}h1{font-size:clamp(34px,6vw,64px);line-height:.98;margin:10px 0 12px;letter-spacing:-.045em}.lead{color:var(--mut);max-width:680px;line-height:1.65;margin:0 0 42px}.category{margin:0 0 42px}.cat-head{display:flex;align-items:end;gap:14px;margin-bottom:18px}.cat-head h2{margin:0;font-size:clamp(22px,3vw,32px);letter-spacing:-.03em}.cat-head span{font-size:12px;color:var(--mut)}.logos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;align-items:stretch}.logo-card{min-height:150px;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;padding:22px;box-shadow:0 8px 30px rgba(15,15,25,.05)}.logo-card img{width:100%;height:100%;max-height:105px;object-fit:contain;filter:grayscale(1);opacity:.68;transition:filter .2s,opacity .2s}.logo-card:hover img,.logo-card:focus img{filter:none;opacity:1}.logo-card .name{text-align:center;color:#555;font-weight:700}footer{margin-top:70px;padding:30px 0 50px;border-top:1px solid var(--line);color:#777;font-size:13px}@media(max-width:900px){.logos{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.wrap{width:calc(100% - 24px)}.logos{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.logo-card{min-height:125px;padding:16px;border-radius:16px}.logo-card img{max-height:82px}}
</style></head><body><header><div class="wrap"><a class="back" href="index.html">← MAIDA Esports</a><div class="eyebrow">Rakan Kerjasama</div><h1>Bersama membina<br>ekosistem esports.</h1><p class="lead">Rakan kerjasama yang menyokong perkembangan komuniti, bakat dan aktiviti MAIDA Esports.</p></div></header><main class="wrap" id="partners"></main><footer><div class="wrap">© MAIDA Esports · Rakan Kerjasama</div></footer><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyCcTJO9K0gXRaCbzdxqxY7hKr0x1PhNHEQ",authDomain:"maidaesportsmy.firebaseapp.com",databaseURL:"https://maidaesportsmy-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"maidaesportsmy",storageBucket:"maidaesportsmy.firebasestorage.app",messagingSenderId:"870248060201",appId:"1:870248060201:web:2954d8fed62c18d47dd338"};const db=getDatabase(initializeApp(firebaseConfig));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function drive(u){const s=String(u||'');let m=s.match(/drive\.google\.com\/file\/d\/([^/]+)/);if(m)return`https://drive.google.com/uc?export=view&id=${m[1]}`;m=s.match(/[?&]id=([^&]+)/);return m&&s.includes('drive.google.com')?`https://drive.google.com/uc?export=view&id=${m[1]}`:s}function render(list){const g={Platinum:[],Premium:[],Gold:[],Silver:[],Bronze:[]};(Array.isArray(list)?list:[]).forEach(p=>{if(p.name||p.logo)(g[p.category]||g.Bronze).push(p)});const o=['Platinum','Premium','Gold','Silver','Bronze'];document.getElementById('partners').innerHTML=o.map(c=>{const x=g[c];if(!x.length)return'';return`<section class="category"><div class="cat-head"><h2>${c}</h2><span>${x.length} rakan</span></div><div class="logos">${x.map(p=>{const inner=p.logo?`<img src="${esc(drive(p.logo))}" alt="${esc(p.name)}" loading="lazy">`:`<span class="name">${esc(p.name)}</span>`;return p.href&&p.href!=='#'?`<a class="logo-card" href="${esc(p.href)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="logo-card">${inner}</div>`}).join('')}</div></section>`}).join('')||'<p style="color:#999">Belum ada rakan kerjasama.</p>'}const fallback=[{category:'Platinum',name:'Jabatan Belia & Sukan Labuan',href:'#',logo:''},{category:'Premium',name:'Perbadanan Labuan',href:'#',logo:''},{category:'Gold',name:'Komuniti NADI Labuan',href:'#',logo:''},{category:'Silver',name:'Esports Malaysia',href:'#',logo:''}];(async()=>{let d=null;try{const x=localStorage.getItem('maida_content');if(x)d=JSON.parse(x)}catch(e){}if(d?.partners)render(d.partners);else try{const s=await get(ref(db,'site/content'));render(s.exists()?(s.val().partners||[]):fallback)}catch(e){render(fallback)}})();
</script></body></html>
